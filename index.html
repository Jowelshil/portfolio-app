<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Portfolio</title>
<meta name="description" content="Investment portfolio with live DSE prices and fund NAVs">
<meta name="theme-color" content="#0b100d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Portfolio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  color-scheme: dark;
  --bg: #0b100d; --card: #141f18; --card-2: #0f1712; --line: rgba(74, 222, 128, .14);
  --text: #e7eee9; --text-2: #9aaba1; --muted: #8fa197; --strong: #f1f5f2;
  --gold: #d9b45a; --pos: #4ade80; --neg: #f87171; --warn: #f5c451;
  /* allocation slots: validated categorical order on the dark card surface */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  max-width: 560px; margin: 0 auto;
}
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }

header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
header h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); display: grid; place-items: center; cursor: pointer;
}
.icon-btn[hidden] { display: none; }
.icon-btn svg { width: 20px; height: 20px; }
.actions { display: flex; gap: 8px; }
#refresh.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.status { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
.chip {
  font-size: .76rem; color: var(--text-2); background: var(--card-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
}
.chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
             margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.chip.open .dot { background: var(--pos); }
.chip.alert { color: var(--warn); border-color: rgba(245, 196, 81, .35); }
.notes { margin: 0 0 10px; padding: 0; list-style: none; }
.notes li { font-size: .78rem; color: var(--warn); margin: 3px 0; }

.card {
  border: 1px solid var(--line); border-radius: 18px;
  background: linear-gradient(160deg, #15221a 0%, var(--card-2) 100%);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
}
.hero { padding: 20px 22px; margin-bottom: 10px; border-color: rgba(74, 222, 128, .24);
  background: radial-gradient(120% 140% at 100% 0%, rgba(74, 222, 128, .16) 0%, transparent 55%),
              linear-gradient(160deg, #17271d 0%, #0e1611 100%); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.kpi { padding: 14px 15px; min-width: 0; }
.label { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.value { font-family: Georgia, "Times New Roman", serif; color: var(--strong); line-height: 1.15;
         font-size: clamp(1.2rem, 5.4vw, 1.6rem); margin: 7px 0 5px; overflow-wrap: anywhere;
         font-variant-numeric: tabular-nums; }
.hero .value { font-size: clamp(2rem, 9.5vw, 2.8rem); }
.hero .cur { color: var(--gold); }
.sub { font-size: .76rem; color: var(--text-2); line-height: 1.4; }
.section { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase;
           color: var(--gold); margin: 18px 2px 8px; }

/* allocation: one stacked bar, 2px gaps, legend rows carry the numbers */
.alloc { padding: 16px; }
.bar { display: flex; gap: 2px; height: 14px; margin: 4px 0 14px; }
.bar span { border-radius: 4px; min-width: 4px; }
.legend { display: grid; gap: 8px; }
.legend div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center;
              font-size: .86rem; }
.legend i { width: 12px; height: 12px; border-radius: 3px; }
.legend .pct { color: var(--text-2); min-width: 3.4em; text-align: right; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
        background: var(--card-2); border: 1px solid var(--line); border-radius: 14px;
        position: sticky; top: env(safe-area-inset-top); z-index: 2; margin-top: 18px; }
.tabs button { border: 0; background: transparent; color: var(--text-2); font: inherit;
               font-size: .8rem; padding: 8px 2px; border-radius: 10px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: #1d2c23; color: var(--strong); }
.panel { margin-top: 10px; }
.panel[hidden] { display: none; }

.rows { padding: 4px 0; }
.row { padding: 12px 15px; border-top: 1px solid rgba(255, 255, 255, .05); cursor: pointer; }
.row:first-child { border-top: 0; }
.row .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.row .name { font-weight: 600; }
.row .meta { font-size: .76rem; color: var(--text-2); }
.row .right { text-align: right; }
.row .detail { display: none; grid-template-columns: 1fr 1fr; gap: 4px 14px; margin-top: 10px;
               font-size: .8rem; color: var(--text-2); }
.row.open .detail { display: grid; }
.row .detail b { color: var(--text); font-weight: 500; float: right; }
.total-row { display: flex; justify-content: space-between; padding: 12px 15px;
             border-top: 1px solid var(--line); font-size: .85rem; color: var(--text-2); }
.foot { font-size: .74rem; color: var(--muted); margin: 10px 2px 0; }
.sub-h { font-size: .9rem; color: var(--text-2); margin: 14px 4px 8px; }

/* dividends chart */
.chart { padding: 14px 12px 8px; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-2); font-size: 11px; }
.chart .grid-l { stroke: rgba(255, 255, 255, .07); }


.chart rect.hit { fill: transparent; cursor: pointer; }
.tip { position: absolute; pointer-events: none; background: #0b100d; border: 1px solid var(--line);
       border-radius: 8px; padding: 6px 9px; font-size: .78rem; white-space: nowrap;
       transform: translate(-50%, -110%); display: none; }

/* value over time */
.hist { padding: 14px 14px 10px; position: relative; }
.hist-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ranges { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.ranges button { border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: .74rem;
                 padding: 4px 8px; border-radius: 8px; cursor: pointer; }
.ranges button[aria-pressed="true"] { background: #1d2c23; color: var(--strong); }
.hist .value { font-size: clamp(1.15rem, 5vw, 1.4rem); margin: 4px 0 2px; }
.hist svg { display: block; width: 100%; height: auto; margin-top: 8px; touch-action: pan-y; }
.hist text { fill: var(--text-2); font-size: 11px; }
.hist .grid-l { stroke: rgba(255, 255, 255, .07); }

.empty { padding: 40px 10px; text-align: center; color: var(--text-2); }

/* passcode screen */
.lock { padding: 26px 22px; margin-top: 30px; text-align: center; }
.lock h2 { font-size: 1.15rem; margin: 6px 0 6px; }
.lock p { color: var(--text-2); font-size: .86rem; margin: 0 0 16px; }
.lock input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
              border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lock button { width: 100%; margin-top: 10px; font: inherit; font-weight: 600; color: #0b100d;
               background: var(--pos); border: 0; border-radius: 12px; padding: 12px; cursor: pointer; }
.lock .err { color: var(--neg); margin: 10px 0 0; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>My Portfolio</h1>
  <div class="actions">
    <button id="lock" class="icon-btn" aria-label="Lock (forget passcode on this phone)" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
    <button id="refresh" class="icon-btn" aria-label="Refresh prices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>
</header>
<div class="status" id="status"></div>
<ul class="notes" id="notes"></ul>
<main id="app"><div class="empty">Loading prices…</div></main>
<p class="foot">Share prices: Dhaka Stock Exchange. Fund NAVs: each AMC's website.
  Updated automatically about every 15 minutes during DSE hours, and every few hours otherwise.</p>

<script>
const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt3 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 3, maximumFractionDigits: 3 });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const taka = (x, signed) => {
  const sign = signed ? (x >= 0 ? "+" : "−") : (x < 0 ? "−" : "");
  return `${sign}৳${fmt.format(Math.abs(x))}`;
};
const pct = x => x == null ? "—" : `${x >= 0 ? "+" : "−"}${fmt2.format(Math.abs(x))}%`;
const tone = x => x == null ? "" : (x >= 0 ? "pos" : "neg");
const n = (x, f = fmt) => x == null ? "—" : f.format(x);
const dshort = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
const SLOTS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
const RANGES = [["1M", 31], ["3M", 92], ["1Y", 366], ["All", 0]];
let range = "3M";
try { range = localStorage.getItem("range") || range; } catch (e) {}
// Bangladeshi units for axis labels: 1 lakh = 1,00,000; 1 crore = 100 lakh
const compact = x => x >= 1e7 ? `${fmt2.format(x / 1e7)} Cr` : x >= 1e5 ? `${fmt2.format(x / 1e5)} L` : fmt.format(x);

let activeTab = "shares";
try { activeTab = localStorage.getItem("tab") || activeTab; } catch (e) {}

function kpi(label, value, sub = "", cls = "") {
  return `<div class="card kpi"><div class="label">${label}</div>
    <div class="value ${cls}">${value}</div><div class="sub">${sub}</div></div>`;
}

function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}

function renderStatus(d, offline) {
  const m = d.market;
  const time = new Date(d.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Dhaka" });
  const chips = [];
  if (!m.live) chips.push(`<span class="chip alert"><span class="dot"></span>DSE prices from CSV</span>`);
  else if (m.open) chips.push(`<span class="chip open"><span class="dot"></span>DSE open</span>`);
  else chips.push(`<span class="chip"><span class="dot"></span>DSE closed · ${esc(m.reason)}</span>`);
  chips.push(`<span class="chip">Updated ${ago(d.generated_at)} · ${time} Dhaka</span>`);
  chips.push(`<span class="chip">${esc(d.nav_line)}</span>`);
  const staleMin = (Date.now() - new Date(d.generated_at).getTime()) / 60000;
  if (offline) chips.push(`<span class="chip alert">Offline · showing last saved data</span>`);
  else if (m.open && staleMin > 45) chips.push(`<span class="chip alert">Update is late</span>`);
  document.getElementById("status").innerHTML = chips.join("");
  document.getElementById("notes").innerHTML = d.warnings.map(w => `<li>⚠ ${esc(w)}</li>`).join("");
}

function holdingRow(name, meta, value, pl, plPct, details) {
  return `<div class="row"><div class="top">
      <div><div class="name">${esc(name)}</div><div class="meta">${meta}</div></div>
      <div class="right"><div class="num">${taka(value)}</div>
        <div class="meta num"><span class="${tone(pl)}">${taka(pl, true)} · ${pct(plPct)}</span></div></div>
    </div><div class="detail">${details.map(([k, v]) => `<div>${k}<b class="num">${v}</b></div>`).join("")}</div></div>`;
}

function sharesPanel(d) {
  const rows = d.shares.map(s => holdingRow(s.name,
    `${esc(s.account)} · ${n(s.shares)} sh · <span class="${tone(s.day_pct)}">${s.day_pct == null ? "—" : pct(s.day_pct) + " today"}</span>`,
    s.value, s.pl, s.pl_pct,
    [["Price", n(s.market_price, fmt2)], ["Avg cost", n(s.buy_price, fmt2)],
     ["Cost", taka(s.cost)], ["Day", pct(s.day_pct)], ["Source", esc(s.source)]])).join("");
  const v = d.shares.reduce((a, s) => a + s.value, 0), c = d.shares.reduce((a, s) => a + s.cost, 0);
  return `<div class="card rows">${rows}<div class="total-row"><span>Total · cost ${taka(c)}</span>
    <span class="num">${taka(v)} · <span class="${tone(v - c)}">${pct((v - c) / c * 100)}</span></span></div></div>
    <p class="foot">Cost is dividend-adjusted. Tap a row for details.</p>`;
}

function fundsPanel(d) {
  const rows = d.funds.map(f => holdingRow(f.name,
    `${n(f.units)} units · NAV ${n(f.market_price, fmt3)}${f.nav_date ? " (" + esc(f.nav_date) + ")" : ""}`,
    f.value, f.pl, f.pl_pct,
    [["NAV", n(f.market_price, fmt3)], ["Avg cost", n(f.buy_price, fmt2)],
     ["Cost", taka(f.cost)], ["NAV date", esc(f.nav_date ?? "—")], ["Source", esc(f.nav_source)]])).join("");
  return `<div class="card rows">${rows}</div>
    <p class="foot">NAV date is the day the AMC's NAV refers to; it often lags today by a working day.</p>`;
}

function fixedPanel(d) {
  const bonds = d.bonds.map(b => `<div class="row"><div class="top">
      <div><div class="name">${esc(b.instrument)}</div>
        <div class="meta">Coupon ${taka(b.coupon_6m)} on ${dshort(b.pay_1)} &amp; ${dshort(b.pay_2)}</div></div>
      <div class="right num">${taka(b.amount)}<div class="meta">matures ${dshort(b.maturity)}</div></div>
    </div></div>`).join("");
  const dps = d.dps.map(p => `<div class="row"><div class="top">
      <div><div class="name">${esc(p.instrument)}</div><div class="meta">${taka(p.monthly_installment)} / month</div></div>
      <div class="right num">${taka(p.amount)}</div></div></div>`).join("");
  return `<div class="sub-h">Government bonds</div><div class="card rows">${bonds}</div>
    <div class="sub-h">DPS</div><div class="card rows">${dps}</div>
    <p class="foot">DPS shows deposits only, excluding interest; it grows by one installment on each pay day.</p>`;
}

function dividendsPanel(d) {
  const ys = d.dividends.by_year, max = Math.max(...ys.map(y => y.amount)) || 1;
  const W = 320, H = 170, pl = 40, pb = 22, step = (W - pl) / ys.length, bw = Math.min(34, step * .6);
  const ticks = [0, .5, 1].map(t => max * t);
  let svg = ticks.map(t => { const y = H - pb - (t / max) * (H - pb - 10);
    return `<line class="grid-l" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/>
            <text x="${pl - 6}" y="${y + 4}" text-anchor="end">${t >= 1000 ? fmt.format(t / 1000) + "k" : fmt.format(t)}</text>`; }).join("");
  ys.forEach((y, i) => {
    const h = (y.amount / max) * (H - pb - 10), x = pl + i * step + (step - bw) / 2, top = H - pb - h;
    // bar with rounded top only (4px), anchored to the baseline
    svg += `<path class="b" d="M${x},${H - pb} V${top + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${H - pb} Z" fill="var(--pos)"/>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${y.year}</text>
      <rect class="hit" data-i="${i}" data-top="${top}" x="${pl + i * step}" y="0" width="${step}" height="${H}"/>`;
  });
  const list = ys.slice().reverse().map(y => `<div class="row"><div class="top"><div class="name">${y.year}</div>
      <div class="num">${taka(y.amount)}</div></div></div>`).join("");
  setTimeout(() => {
    const box = document.querySelector(".chart"), tip = box && box.querySelector(".tip");
    if (!box) return;
    box.querySelectorAll("rect.hit").forEach(r => {
      const show = () => { const y = ys[+r.dataset.i], bb = r.getBoundingClientRect(), cb = box.getBoundingClientRect();
        tip.innerHTML = `<b>${y.year}</b> · ${taka(y.amount)}`; tip.style.display = "block";
        const scale = bb.height / H;   // svg units -> pixels
        tip.style.left = `${bb.left - cb.left + bb.width / 2}px`;
        tip.style.top = `${bb.top - cb.top + r.dataset.top * scale - 4}px`; };
      r.addEventListener("pointerenter", show); r.addEventListener("click", show);
      r.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    });
  });
  return `<div class="card chart"><div class="label" style="margin:0 4px 8px">Cash dividends received per year</div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dividends per year">${svg}</svg><div class="tip"></div></div>
    <div class="card rows" style="margin-top:10px">${list}</div>`;
}

function drawHistory(d) {
  const box = document.getElementById("hist");
  if (!box) return;
  const all = d.history || [];
  if (all.length < 2) {
    box.innerHTML = `<div class="label">Total portfolio value</div>
      <p class="sub" style="margin:8px 0 2px">Recording one value per day since ${all.length ? dshort(all[0].date) : "today"}.
      The chart appears from the second day.</p>`;
    return;
  }
  const day = h => new Date(h.date + "T00:00:00").getTime();
  const span = RANGES.find(r => r[0] === range)[1], endT = day(all[all.length - 1]);
  let pts = span ? all.filter(h => (endT - day(h)) / 864e5 <= span) : all;
  if (pts.length < 2) pts = all.slice(-2);
  const first = pts[0], last = pts[pts.length - 1], chg = last.total - first.total;

  const W = 340, H = 170, pl = 50, pr = 10, pt = 10, pb = 22;
  const t0 = day(first), t1 = day(last);
  let lo = Math.min(...pts.map(p => p.total)), hi = Math.max(...pts.map(p => p.total));
  const pad = (hi - lo) * .1 || hi * .01; lo -= pad; hi += pad;
  const X = h => pl + (day(h) - t0) / (t1 - t0 || 1) * (W - pl - pr);
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p).toFixed(1)},${Y(p.total).toFixed(1)}`).join("");
  const area = `${line}L${X(last).toFixed(1)},${H - pb}L${X(first).toFixed(1)},${H - pb}Z`;
  const grid = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<line class="grid-l" x1="${pl}" x2="${W - pr}"
      y1="${Y(v)}" y2="${Y(v)}"/><text x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${compact(v)}</text>`).join("");
  const dlabel = h => new Date(h.date + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });

  box.innerHTML = `<div class="hist-head">
      <div><div class="label">Total portfolio value</div>
        <div class="value num">${taka(last.total)}</div>
        <div class="sub"><span class="${tone(chg)}">${taka(chg, true)} · ${pct(chg / first.total * 100)}</span>
          since ${dshort(first.date)}</div></div>
      <div class="ranges">${RANGES.map(([k]) => `<button data-range="${k}" aria-pressed="${k === range}">${k}</button>`).join("")}</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Total portfolio value over time">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--pos)" stop-opacity=".22"/><stop offset="1" stop-color="var(--pos)" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#hg)"/>
      <path d="${line}" fill="none" stroke="var(--pos)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="${pl}" y="${H - 6}">${dlabel(first)}</text>
      <text x="${W - pr}" y="${H - 6}" text-anchor="end">${dlabel(last)}</text>
      <line class="xh" y1="${pt}" y2="${H - pb}" stroke="var(--text-2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
      <circle class="dot" r="5" fill="var(--pos)" stroke="var(--bg)" stroke-width="2" visibility="hidden"/>
    </svg><div class="tip"></div>`;

  box.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
    range = b.dataset.range;
    try { localStorage.setItem("range", range); } catch (e) {}
    drawHistory(d);
  }));
  const svg = box.querySelector("svg"), xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot"), tip = box.querySelector(".tip");
  const show = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * W;
    const p = pts.reduce((a, b) => Math.abs(X(b) - sx) < Math.abs(X(a) - sx) ? b : a);
    const x = X(p), y = Y(p.total), k = r.width / W;
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("visibility", "visible");
    const c = p.total - first.total;
    tip.innerHTML = `<b>${dshort(p.date)}</b> · ${taka(p.total)}<br><span class="${tone(c)}">${taka(c, true)}</span> since ${dlabel(first)}`;
    tip.style.display = "block";
    // position relative to the card; keep the whole tooltip inside it
    const br = box.getBoundingClientRect(), half = tip.offsetWidth / 2 + 4;
    tip.style.left = `${Math.min(Math.max(r.left - br.left + x * k, half), br.width - half)}px`;
    tip.style.top = `${r.top - br.top + y * k - 8}px`;
  };
  const hide = () => { xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

function render(d, offline) {
  renderStatus(d, offline);
  const day = d.day
    ? kpi(d.market.open ? "Today vs yesterday's close · shares" : "Last session vs previous close · shares",
          taka(d.day.total, true), `<span class="${tone(d.day.total)}">${pct(d.day.pct)}</span>`, tone(d.day.total))
    : kpi("Daily change · shares", "—", "Live DSE prices unavailable");
  const u = d.unrealized, nc = d.next_coupon, dv = d.dividends;
  const total = d.allocation.reduce((a, x) => a + x.value, 0);
  const tabs = [["shares", "Shares"], ["funds", "Funds"], ["fixed", "Bonds & DPS"], ["divs", "Dividends"]];
  document.getElementById("app").innerHTML = `
    <div class="card hero"><div class="label">Total portfolio value</div>
      <div class="value"><span class="cur">৳</span>${fmt.format(d.total_value)}</div>
      <div class="sub">Shares &amp; funds at market, bonds &amp; DPS at book</div></div>
    <div class="section">Value over time</div>
    <div class="card hist" id="hist"></div>
    <div class="grid">${day}${kpi("Unrealized gain · shares &amp; funds", taka(u.total, true),
      `<span class="${tone(u.total)}">${pct(u.pct)}</span> on dividend-adjusted cost`, tone(u.total))}</div>
    <div class="grid">${kpi("Realized gain · booked sales", taka(d.realized.total, true),
      `${d.realized.holdings} holdings, all years`, tone(d.realized.total))}${nc
      ? kpi("Next bond coupon", taka(nc.amount), `${dshort(nc.date)} · in ${nc.days} days<br>${esc(nc.instrument)}`)
      : kpi("Next bond coupon", "—", "No upcoming payment dates")}</div>
    <div class="section">Passive income</div>
    <div class="grid">${kpi("Bond coupon per year", taka(d.yearly_coupon), `Net of tax, on ${taka(d.bond_principal)} principal`)}${
      kpi(`Dividends received · ${dv.first_year}–${String(dv.last_year).slice(-2)}`, taka(dv.total),
          `${dv.year} so far: ${taka(dv.this_year)}<br>Already netted in share cost`)}</div>
    <div class="section">Asset allocation</div>
    <div class="card alloc">
      <div class="bar" role="img" aria-label="Asset allocation">${d.allocation.map((a, i) =>
        `<span style="flex:${a.value};background:${SLOTS[i]}"></span>`).join("")}</div>
      <div class="legend">${d.allocation.map((a, i) => `<div><i style="background:${SLOTS[i]}"></i>
        <span>${esc(a.name)}</span><span class="num">${taka(a.value)}</span>
        <span class="pct num">${fmt2.format(a.value / total * 100)}%</span></div>`).join("")}</div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${k === activeTab}">${l}</button>`).join("")}</div>
    <div class="panel" data-panel="shares" ${activeTab === "shares" ? "" : "hidden"}>${sharesPanel(d)}</div>
    <div class="panel" data-panel="funds" ${activeTab === "funds" ? "" : "hidden"}>${fundsPanel(d)}</div>
    <div class="panel" data-panel="fixed" ${activeTab === "fixed" ? "" : "hidden"}>${fixedPanel(d)}</div>
    <div class="panel" data-panel="divs" ${activeTab === "divs" ? "" : "hidden"}>${dividendsPanel(d)}</div>`;
  drawHistory(d);
}

document.getElementById("app").addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    activeTab = tab.dataset.tab;
    try { localStorage.setItem("tab", activeTab); } catch (err) {}
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === activeTab));
    document.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== activeTab; });
    return;
  }
  const row = e.target.closest(".row");
  if (row && row.querySelector(".detail")) row.classList.toggle("open");
});

const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} },
};

// The published numbers are encrypted (mobile/build.py): AES-256-GCM, key from the
// passcode via PBKDF2-SHA256. The passcode is kept on this phone only.
class NeedPasscode extends Error {}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const keys = {};                       // derived key per build, so a refresh of the same build is instant
async function decrypt(box, passcode) {
  const id = box.salt + passcode;
  if (!keys[id]) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(passcode), "PBKDF2", false, ["deriveKey"]);
    keys[id] = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: b64(box.salt), iterations: box.iter },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, keys[id], b64(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function fetchData() {
  const t = Date.now();
  const r = await fetch(`data.enc.json?t=${t}`, { cache: "no-store" });
  if (r.ok) {
    const box = await r.json();
    document.getElementById("lock").hidden = false;
    const pass = store.get("pass");
    if (!pass) throw new NeedPasscode("");
    try { return await decrypt(box, pass); }
    catch (e) { store.del("pass"); throw new NeedPasscode("That passcode didn't work. Try again."); }
  }
  const p = await fetch(`data.json?t=${t}`, { cache: "no-store" });   // unencrypted local build
  if (!p.ok) throw new Error(p.status);
  return p.json();
}

let last = null, locked = false;
function showLock(message) {
  locked = true;
  document.getElementById("status").innerHTML = "";
  document.getElementById("notes").innerHTML = "";
  document.getElementById("app").innerHTML = `<form class="card lock" id="unlock">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="var(--gold)" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/>
           <path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <h2>Enter your passcode</h2>
      <p>Your portfolio is encrypted. You only need to enter this once on this phone.</p>
      <input type="password" name="pass" autocomplete="current-password" aria-label="Passcode" required>
      <button type="submit">Unlock</button>
      <p class="err">${esc(message)}</p></form>`;
  document.querySelector("#unlock input").focus();
}

async function load() {
  if (locked) return;                  // don't wipe a half-typed passcode
  const btn = document.getElementById("refresh");
  btn.classList.add("spin");
  try {
    last = await fetchData();
    store.set("data", JSON.stringify(last));
    render(last, !navigator.onLine);   // offline: the service worker served its saved copy
  } catch (e) {
    if (e instanceof NeedPasscode) { showLock(e.message); return; }
    let saved = last;
    try { saved = saved || JSON.parse(store.get("data")); } catch (err) {}
    if (saved) render(saved, true);
    else document.getElementById("app").innerHTML = `<div class="empty">No connection and no saved data yet.<br>Try again when online.</div>`;
  } finally {
    btn.classList.remove("spin");
  }
}

document.getElementById("app").addEventListener("submit", e => {
  e.preventDefault();
  store.set("pass", e.target.elements.pass.value);
  locked = false;
  document.getElementById("app").innerHTML = `<div class="empty">Unlocking…</div>`;
  load();
});
document.getElementById("lock").addEventListener("click", () => {
  store.del("pass"); store.del("data"); last = null;
  showLock("");
});
document.getElementById("refresh").addEventListener("click", () => { if (!locked) load(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 5 * 60 * 1000);
load();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
